name: hermes-inventory
version: "0.2.0"
description: "Add photographed physical items to a HomeBox inventory."
manifest_version: 1
provides_tools: [inventory_ingest]
requires_env:
  - name: HOMEBOX_URL
    description: "Base URL of the HomeBox server."
    secret: false
  - name: HOMEBOX_API_KEY
    description: "API key used to authenticate with HomeBox."
    secret: true